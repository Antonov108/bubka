<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Какой подарок хочет пися? 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Manrope:wght@400;500;600&family=Marck+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0d14;--bg2:#2a1420;--pink:#ff8fb8;--blush:#ffdce8;--ink:#fff4f8;--muted:#d9b3c3;color-scheme:dark;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;--script:"Marck Script",cursive}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% 0,#4a1f36 0,var(--bg) 60%) fixed;color:var(--ink);font-family:var(--sans);line-height:1.6;overflow-x:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
main{max-width:760px;margin:0 auto;padding:9vh 6vw 12vh;text-align:center}
h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(2.4rem,10vw,4.6rem);line-height:1.05;color:var(--blush);animation:in 1s both}
@keyframes in{from{opacity:0;transform:translateY(24px)}}
.lead{color:var(--muted);margin:1rem auto 2.5rem;max-width:32ch;animation:in 1s .3s both}
h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(1.6rem,6vw,2.3rem);color:var(--blush);margin-bottom:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.opt{position:relative;background:var(--bg2);border:2px solid transparent;border-radius:20px;padding:14px 14px 16px;cursor:pointer;color:inherit;font:inherit;transition:.3s}
.opt:hover{transform:translateY(-4px) rotate(-1deg)}
.opt img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.opt span{display:block;margin-top:10px;font-family:var(--serif);font-size:1.4rem}
.opt[aria-pressed=true]{border-color:var(--pink);background:#3d1a2d;box-shadow:0 0 40px #ff8fb844}
.opt[aria-pressed=true]::after{content:"💗";position:absolute;top:8px;right:10px;font-size:1.5rem;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.opt:focus-visible,.go:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.other{margin-top:16px;width:100%;background:var(--bg2);border:2px solid #4a2a3b;border-radius:99px;padding:.8rem 1.4rem;color:var(--ink);font:inherit;text-align:center}
.other::placeholder{color:var(--muted)}
.fin{margin-top:5rem}
.fin q{display:block;font-family:var(--serif);font-style:italic;font-size:clamp(1.5rem,5.5vw,2.2rem);color:var(--ink);quotes:none;margin-bottom:2rem}
.val{font-family:var(--serif);font-size:clamp(3rem,14vw,5.5rem);color:var(--pink);line-height:1}
.vm{min-height:2rem;font-family:var(--script);font-size:1.6rem;color:var(--blush);margin:.3rem 0 1.2rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--pink) var(--p,0%),#4a2a3b var(--p,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--blush);border:3px solid var(--pink);box-shadow:0 0 18px var(--pink)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--blush);border:3px solid var(--pink)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-top:.5rem}
.go{margin-top:3rem;background:var(--pink);color:var(--bg);border:0;border-radius:99px;font:600 1.1rem var(--sans);padding:1rem 2.4rem;cursor:pointer;transition:.3s}
.go:hover{transform:scale(1.06)}
#res{display:none;margin-top:3rem;background:var(--bg2);border-radius:24px;padding:1.6rem;animation:in .8s both}
#res p{font-family:var(--serif);font-size:1.5rem;margin-bottom:1rem}
#res a,#res button{display:inline-block;margin:.3rem;background:none;border:2px solid var(--pink);color:var(--pink);border-radius:99px;padding:.6rem 1.4rem;font:500 1rem var(--sans);text-decoration:none;cursor:pointer}
.sign{font-family:var(--script);font-size:clamp(2.2rem,8vw,3.6rem);color:var(--pink);margin-top:3rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
